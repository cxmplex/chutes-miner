{{- define "redis.url" -}}
redis://:$(REDIS_PASSWORD)@redis:6379
{{- end }}

{{- define "postgresql.url" -}}
postgresql+asyncpg://{{ .Values.postgres.database.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database.name }}
{{- end }}

{{- if .Values.auditExporter.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-exporter
spec:
  schedule: "1 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 5
      template:
        metadata:
          labels:
            postgres-access: "true"
            redis-access: "true"
        spec:
          {{ if .Values.multiCluster }}
          serviceAccountName: chutes
          {{- end }}
          {{- with .Values.auditExporter.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: audit-export
            image: {{ .Values.seedlessStack.image }}
            imagePullPolicy: IfNotPresent
            command: ["python", "chutes-miner/chutes_miner/audit_exporter.py"]
            env:
              - name: MINER_OWNER_SS58
                valueFrom:
                  secretKeyRef:
                    name: miner-credentials
                    key: owner
              - name: CHUTES_ATTESTED_SESSION_FILE
                value: {{ .Values.seedlessStack.sessionEnvPath | quote }}
              - name: REDIS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: redis-secret
                    key: {{ .Values.redis.password.passwordKey }}
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: {{ .Values.postgres.database.passwordKey }}
              - name: POSTGRESQL
                value: {{ include "postgresql.url" . }}
              - name: REDIS_URL
                value: {{ include "redis.url" . }}
              - name: CHUTES_VALIDATORS_FILE
                value: {{ .Values.seedlessStack.sessionJsonPath | quote }}
              - name: CHUTES_GPU_REGISTRATION_FILE
                value: {{ .Values.seedlessStack.registrationPath | quote }}
              - name: GPU_TEE_ONLY
                value: "true"
              {{ if .Values.multiCluster }}
              - name: MONITORING_NAMESPACE
                value: "monitoring"
              {{- end }}
            volumeMounts:
              - name: chutes-gpu-runtime
                mountPath: {{ .Values.seedlessStack.runtimeHostPath }}
                readOnly: true
          volumes:
            - name: chutes-gpu-runtime
              hostPath:
                path: {{ .Values.seedlessStack.runtimeHostPath }}
                type: Directory
          restartPolicy: OnFailure
{{- end }}
