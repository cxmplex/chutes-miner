{{- define "redis.url" -}}
redis://:$(REDIS_PASSWORD)@redis:6379
{{- end }}

{{- define "postgresql.url" -}}
postgresql+asyncpg://{{ .Values.postgres.database.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database.name }}
{{- end }}


{{- if .Values.multiCluster }}
{{- fail "seedless whole-fabric mode requires the single-cluster operator" }}
{{- end }}
{{- if not (has .Values.minerApi.requireV2ManagementSignatures (list "true" "false")) }}
{{- fail "minerApi.requireV2ManagementSignatures must be explicitly true or false" }}
{{- end }}
{{- if not (regexMatch "^chutes[.]local/seedless-stack@sha256:[0-9a-f]{64}$" .Values.seedlessStack.image) }}
{{- fail "seedless stack image must be the measured digest reference" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "minerApi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "minerApi.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minerApi.labels" . | nindent 8 }}
    spec:
      serviceAccountName: chutes
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 2000
      {{- with .Values.minerApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.minerApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.minerApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{ if .Values.multiCluster }}
      initContainers:
        - name: get-node-ip
          image: "{{ .Values.seedlessStack.kubectlImage }}"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              NODE_IP=$(kubectl get node ${NODE_NAME} -o jsonpath='{.metadata.labels.chutes/external-ip}')
              cat > /shared/env.sh << EOF
              export NODE_IP="${NODE_IP}"
              export MONITOR_API="http://${NODE_IP}:32001"
              EOF
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.seedlessStack.image }}"
          imagePullPolicy: {{ .Values.minerApi.imagePullPolicy }}
          {{ if .Values.multiCluster }}
          command:
            - sh
            - -c
            - |
              . /shared/env.sh
              exec python -m uvicorn --host 0.0.0.0 --port {{ .Values.minerApi.service.targetPort }} --workers 4 chutes_miner.api.main:app
          {{- else }}
          command: ["python", "-m", "uvicorn", "--host", "0.0.0.0", "--port", "{{ .Values.minerApi.service.targetPort }}", "--workers", "4", "chutes_miner.api.main:app"]
          {{- end }}
          env:
            - name: MINER_OWNER_SS58
              valueFrom:
                secretKeyRef:
                  name: miner-credentials
                  key: owner
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: {{ .Values.redis.password.passwordKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: {{ .Values.postgres.database.passwordKey }}
            - name: POSTGRESQL
              value: {{ include "postgresql.url" . }}
            - name: REDIS_URL
              value: {{ include "redis.url" . }}
            - name: CHUTES_VALIDATORS_FILE
              value: {{ .Values.seedlessStack.sessionJsonPath | quote }}
            - name: CHUTES_GPU_REGISTRATION_FILE
              value: {{ .Values.seedlessStack.registrationPath | quote }}
            - name: CHUTES_GPU_VERIFIED_ENV_FILE
              value: {{ .Values.seedlessStack.verifiedEnvPath | quote }}
            - name: CHUTES_ATTESTED_CERT_FILE
              value: {{ required "seedlessStack.attestedCertPath is required" .Values.seedlessStack.attestedCertPath | quote }}
            - name: CHUTES_ATTESTED_KEY_FILE
              value: {{ required "seedlessStack.attestedKeyPath is required" .Values.seedlessStack.attestedKeyPath | quote }}
            - name: CHUTES_REGISTRY_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/chutes-registry-workload/token
            - name: GPU_TEE_ONLY
              value: "true"
            - name: CHUTES_REQUIRE_V2_MANAGEMENT_SIGNATURES
              value: {{ .Values.minerApi.requireV2ManagementSignatures | quote }}
            - name: REGISTRY_PROXY_PORT
              value: "{{ .Values.registry.service.nodePort }}"
            {{- if not .Values.multiCluster }}
            - name: NVIDIA_RUNTIME
              value: nvidia-container-runtime
            {{- end }}
            {{- if .Values.multiCluster }}
            - name: MONITORING_NAMESPACE
              value: "monitoring"
            - name: SERVICE_ACCOUNT_TOKEN_PATH
              value: "/var/run/secrets/chutes-sa-token/token"
            - name: SERVICE_ACCOUNT_CA_PATH
              value: "/var/run/secrets/chutes-sa-token/ca.crt"
            {{- end }}
          volumeMounts:
            - name: chutes-gpu-session-json
              mountPath: {{ .Values.seedlessStack.sessionJsonPath }}
              readOnly: true
            - name: chutes-gpu-registration
              mountPath: {{ .Values.seedlessStack.registrationPath }}
              readOnly: true
            - name: chutes-gpu-verified-env
              mountPath: {{ .Values.seedlessStack.verifiedEnvPath }}
              readOnly: true
            - name: chutes-gpu-attested-cert
              mountPath: {{ required "seedlessStack.attestedCertPath is required" .Values.seedlessStack.attestedCertPath }}
              readOnly: true
            - name: chutes-gpu-attested-key
              mountPath: {{ required "seedlessStack.attestedKeyPath is required" .Values.seedlessStack.attestedKeyPath }}
              readOnly: true
            - name: registry-workload-auth
              mountPath: /var/run/secrets/chutes-registry-workload
              readOnly: true
          {{ if .Values.multiCluster }}
            - name: shared-data
              mountPath: /shared
            - name: chutes-token
              mountPath: /var/run/secrets/chutes-sa-token
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.minerApi.service.targetPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            {{- toYaml .Values.minerApi.resources | nindent 12 }}
      volumes:
        - name: chutes-gpu-session-json
          hostPath:
            path: {{ .Values.seedlessStack.sessionJsonPath }}
            type: File
        - name: chutes-gpu-registration
          hostPath:
            path: {{ .Values.seedlessStack.registrationPath }}
            type: File
        - name: chutes-gpu-verified-env
          hostPath:
            path: {{ .Values.seedlessStack.verifiedEnvPath }}
            type: File
        - name: chutes-gpu-attested-cert
          hostPath:
            path: {{ required "seedlessStack.attestedCertHostPath is required" .Values.seedlessStack.attestedCertHostPath }}
            type: File
        - name: chutes-gpu-attested-key
          hostPath:
            path: {{ required "seedlessStack.attestedKeyHostPath is required" .Values.seedlessStack.attestedKeyHostPath }}
            type: File
        - name: registry-workload-auth
          secret:
            secretName: {{ required "registryWorkloadAuth.existingSecret is required" .Values.registryWorkloadAuth.existingSecret }}
            defaultMode: 0440
            items:
              - key: token
                path: token
      {{ if .Values.multiCluster }}
        - name: shared-data
          emptyDir: {}
        - name: chutes-token
          secret:
            secretName: chutes-sa-token
      {{- end }}
