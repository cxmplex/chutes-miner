seedlessStack:
  image: ""
  runtimeHostPath: /run/chutes-gpu
  sessionEnvPath: /run/chutes-gpu/miner-session.env
  sessionJsonPath: /run/chutes-gpu/miner-session.json
  registrationPath: /run/chutes-gpu/registration.json
  attestedCertPath: /run/chutes-tls/server.crt
  kubectlImage: bitnamilegacy/kubectl@sha256:cd354d5b25562b195b277125439c23e4046902d7f1abc0dc3c75aad04d298c17

# Set this value to true if oeprating a mutli cluster k3s environment
multiCluster: false

calico: true

cache:
  max_age_days: 30
  max_size_gb: 500
  overrides:
# Add any per-node cache size (in GB) overrides here, e.g.:
#    chutes-miner-gpu-0: 1000
#    chutes-miner-gpu-1: 1500

kubeconfig:
  hostPath: '/home/ubuntu/.kube/config'
  localPath: /tmp/kube/config

validators:
  defaultRegistry: registry.chutes.ai
  defaultApi: https://api.chutes.ai
  supported:
    - hotkey: 5Dt7HZ7Zpw4DppPxFM7Ke3Cm7sDAWhsZXmM5ZAmE7dSVJbcQ
      registry: registry.chutes.ai
      api: https://api.chutes.ai
      socket: wss://ws.chutes.ai

minerApi:
  # Set to "false" only for the measured producer-first migration window.
  # The final remediation deployment must restore "true".
  requireV2ManagementSignatures: "true"
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  service:
    type: NodePort
    nodePort: 32000
    port: 8000
    targetPort: 8000
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}
  tolerations: []


gepetto:
  imagePullPolicy: IfNotPresent
  # Enable validator migrations (run on Gepetto startup). Default true in charts.
  validatorMigrationsEnabled: true
  # Seconds to wait for a new deployment to appear in the pod cache after job creation.
  deployCacheWaitTimeout: 60
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}
  tolerations: []

postgres:
  image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  imagePullPolicy: IfNotPresent
  persistence:
    enabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  database:
    name: chutes
    user: chutes
    passwordKey: "postgres-password"
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}
  tolerations: []

redis:
  image: redis@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 1
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  service:
    type: ClusterIP
    port: 6379
  password:
    passwordKey: "redis-password"
  config:
    customArgs: []

registry:
  service:
    # BE SURE THIS MATCHES registry_port IN ANSIBLE!
    nodePort: 30500


monitor:
  enabled: false
  imagePullPolicy: IfNotPresent
  # Interval in seconds for the monitoring reconciliation loop (cache sync + reinitiate unhealthy clusters)
  reconciliationIntervalSeconds: 60
  # Minimum seconds between reinitiate attempts per cluster (throttle for reinitiate-unhealthy)
  reinitiateIntervalSeconds: 120
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  service:
    type: NodePort
    nodePort: 32001
    port: 8000
    targetPort: 8000
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}

# Public miner owner identity, injected by Ansible during deployment.
minerCredentials:
  ownerSs58: ""
