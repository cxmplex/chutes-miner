{{- $root := . -}}
{{- $nodePort := required "registry.service.nodePort is required for the local registry mirror contract" .Values.registry.service.nodePort -}}
{{- if ne (len .Values.validators.supported) 1 }}
{{- fail "seedless GPU artifact requires exactly one validator" }}
{{- end }}
{{- range .Values.validators.supported }}
apiVersion: v1
kind: Service
metadata:
  name: registry-{{ .hotkey | lower }}
  labels:
    {{- include "registry.labels" $root | nindent 4 }}
spec:
  # GPU image references and the node container-runtime mirror both use the
  # node-local host:nodePort endpoint. This exposure is therefore an explicit
  # wire contract, not a selectable Service type.
  type: NodePort
  internalTrafficPolicy: Local
  externalTrafficPolicy: Local
  ports:
    - port: {{ $root.Values.registry.service.port }}
      targetPort: {{ $root.Values.registry.service.targetPort }}
      protocol: TCP
      nodePort: {{ $nodePort }}
      name: http
  selector:
    {{- include "registry.labels" $root | nindent 4 }}
{{- end }}
