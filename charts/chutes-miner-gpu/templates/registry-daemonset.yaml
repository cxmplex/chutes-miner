apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "registry.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "registry.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 2000
      {{- with .Values.registry.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # restartPolicy: Always on an init container makes it a native sidecar
      # (KEP-753). It starts before regular containers, but keeps running for
      # the pod's lifetime instead of exiting after init.
      initContainers:
        - name: auth
          image: "{{ .Values.seedlessStack.image }}"
          imagePullPolicy: {{ .Values.auth.imagePullPolicy }}
          restartPolicy: Always
          command:
            - python
            - -m
            - uvicorn
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.auth.port }}"
            - chutes_registry.main:app
          env:
            - name: MINER_OWNER_SS58
              valueFrom:
                secretKeyRef:
                  name: miner-credentials
                  key: owner
            - name: CHUTES_VALIDATORS_FILE
              value: {{ .Values.seedlessStack.sessionJsonPath | quote }}
            - name: CHUTES_GPU_REGISTRATION_FILE
              value: {{ .Values.seedlessStack.registrationPath | quote }}
            - name: CHUTES_ATTESTED_CERT_FILE
              value: {{ .Values.seedlessStack.attestedCertPath | quote }}
            - name: GPU_TEE_ONLY
              value: "true"
            - name: CHUTES_ATTESTED_KEY_FILE
              value: {{ .Values.seedlessStack.attestedKeyPath | quote }}
            - name: CHUTES_REGISTRY_WORKLOAD_TOKEN_FILE
              value: /var/run/secrets/chutes-registry-workload/token
            - name: CHUTES_REGISTRY_SCOPES_FILE
              value: /var/lib/chutes-registry/scopes.json
          ports:
            - name: auth
              containerPort: {{ .Values.auth.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: {{ .Values.auth.port }}
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 60
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          volumeMounts:
            - name: chutes-gpu-session-json
              mountPath: {{ .Values.seedlessStack.sessionJsonPath }}
              readOnly: true
            - name: chutes-gpu-registration
              mountPath: {{ .Values.seedlessStack.registrationPath }}
              readOnly: true
            - name: chutes-gpu-attested-cert
              mountPath: {{ .Values.seedlessStack.attestedCertPath }}
              readOnly: true
            - name: chutes-gpu-attested-key
              mountPath: {{ .Values.seedlessStack.attestedKeyPath }}
              readOnly: true
            - name: registry-workload-auth
              mountPath: /var/run/secrets/chutes-registry-workload
              readOnly: true
            - name: chutes-registry-scopes
              mountPath: /var/lib/chutes-registry
      containers:
        - name: registry
          image: "{{ .Values.registry.image }}"
          imagePullPolicy: {{ .Values.registry.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          volumeMounts:
            - name: registry-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: chutes-gpu-attested-cert
              mountPath: {{ .Values.seedlessStack.attestedCertPath }}
              readOnly: true
            - name: chutes-gpu-attested-key
              mountPath: {{ .Values.seedlessStack.attestedKeyPath }}
              readOnly: true
      volumes:
        - name: chutes-gpu-session-json
          hostPath:
            path: {{ .Values.seedlessStack.sessionJsonPath }}
            type: File
        - name: chutes-gpu-registration
          hostPath:
            path: {{ .Values.seedlessStack.registrationPath }}
            type: File
        - name: registry-nginx-config
          configMap:
            name: registry-nginx-config
        - name: chutes-gpu-attested-cert
          hostPath:
            path: {{ .Values.seedlessStack.attestedCertHostPath }}
            type: File
        - name: chutes-gpu-attested-key
          hostPath:
            path: {{ .Values.seedlessStack.attestedKeyHostPath }}
            type: File
        - name: registry-workload-auth
          secret:
            secretName: {{ required "registryWorkloadAuth.existingSecret is required" .Values.registryWorkloadAuth.existingSecret }}
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: chutes-registry-scopes
          emptyDir: {}
