{{ if .Values.multiCluster }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
    spec:
      priorityClassName: critical-pod-priority
      serviceAccountName: agent
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups:
          - 2000
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: critical-priority
      containers:
        - name: agent
          image: "{{ .Values.seedlessStack.image }}"
          imagePullPolicy: {{ .Values.agent.imagePullPolicy }}
          command:
            - python
            - -m
            - uvicorn
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.agent.service.targetPort }}"
            - chutes_agent.api.main:app
          env:
            - name: MINER_OWNER_SS58
              valueFrom:
                secretKeyRef:
                  name: miner-credentials
                  key: owner
            - name: CHUTES_VALIDATORS_FILE
              value: {{ .Values.seedlessStack.sessionJsonPath | quote }}
            - name: CHUTES_GPU_REGISTRATION_FILE
              value: {{ .Values.seedlessStack.registrationPath | quote }}
            - name: GPU_TEE_ONLY
              value: "true"
            - name: CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTROL_PLANE_URL_FILE
              value: "/app/state/control_plane_url"
          ports:
            - name: http
              containerPort: {{ .Values.agent.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: chutes-gpu-session-json
              mountPath: {{ .Values.seedlessStack.sessionJsonPath }}
              readOnly: true
            - name: chutes-gpu-registration
              mountPath: {{ .Values.seedlessStack.registrationPath }}
              readOnly: true
            - name: chutes-agent-state
              mountPath: /app/state
              readOnly: false
          livenessProbe:
            httpGet:
              path: /monitor/health
              port: http
            initialDelaySeconds: 30  # Wait before first check
            periodSeconds: 10        # Check every 10 seconds
            timeoutSeconds: 5        # Timeout for each check
            failureThreshold: 3      # Fail after 3 consecutive failures
          readinessProbe:
            httpGet:
              path: /monitor/health
              port: http
            initialDelaySeconds: 10  # Start sooner for readiness
            periodSeconds: 5         # Check more frequently
            timeoutSeconds: 3        # Shorter timeout
            failureThreshold: 3      # Fail after 3 consecutive failures
      volumes:
        - name: chutes-gpu-session-json
          hostPath:
            path: {{ .Values.seedlessStack.sessionJsonPath }}
            type: File
        - name: chutes-gpu-registration
          hostPath:
            path: {{ .Values.seedlessStack.registrationPath }}
            type: File
        - name: chutes-agent-state
          hostPath:
            path: /var/lib/chutes/agent
            type: DirectoryOrCreate
{{- end }}
