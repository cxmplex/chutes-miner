seedlessStack:
  image: ""
  runtimeHostPath: /run/chutes-gpu
  sessionEnvPath: /run/chutes-gpu/miner-session.env
  sessionJsonPath: /run/chutes-gpu/miner-session.json
  registrationPath: /run/chutes-gpu/registration.json
  attestedCertPath: /run/chutes-tls/server.crt

multiCluster: false

validators:
  defaultRegistry: registry.chutes.ai
  defaultApi: https://api.chutes.ai
  supported:
    - hotkey: 5Dt7HZ7Zpw4DppPxFM7Ke3Cm7sDAWhsZXmM5ZAmE7dSVJbcQ
      registry: registry.chutes.ai
      api: https://api.chutes.ai
      socket: wss://ws.chutes.ai

registry:
  image: parachutes/nginx-proxy@sha256:af44ec89c18ed30caca38f08122d7cb091112cd01e3081b769e8172c86304a42
  imagePullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
    # BE SURE THIS MATCHES registry_port IN ANSIBLE!
    nodePort: 30500
  nodeSelector:
    chutes/seedless-control-plane: "true"
  config:
    workerProcesses: 1
    workerConnections: 1024
    keepaliveTimeout: 65
    clientMaxBodySize: "0"
    validators:
      allowedHosts:
        - "registry.chutes.ai"
      defaultUpstream: "registry.chutes.ai"

auth:
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi
  port: 8000

agent:
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  service:
    type: NodePort
    nodePort: 32000
    port: 8000
    targetPort: 8000
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}

failedChuteCleanup:
  image: parachutes/failed-chute-cleanup@sha256:2b90539e78e997254ee3a6f0c6d0f5e597e164503cd8a2620ce9f933b0450e28
  imagePullPolicy: Always

# Miner credentials - These are provided via Ansible deployment
# These values are automatically injected during deployment and should not be set manually
# as they are sensitive values
minerCredentials:
  ownerSs58: "REPLACE_WITH_ATTESTED_OWNER_SS58"