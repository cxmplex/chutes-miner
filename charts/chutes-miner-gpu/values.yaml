seedlessStack:
  image: ""
  runtimeHostPath: /run/chutes-gpu
  sessionEnvPath: /run/chutes-gpu/credentials/runtime-session.env
  sessionJsonPath: /run/chutes-gpu/credentials/runtime-session.json
  registrationPath: /run/chutes-gpu/registration.json
  attestedCertPath: /run/chutes-tls/server.crt
  attestedKeyPath: /run/chutes-tls/server.key
  attestedCertHostPath: /run/chutes-gpu/registry-tls/server.crt
  attestedKeyHostPath: /run/chutes-gpu/registry-tls/server.key

multiCluster: false

validators:
  defaultRegistry: registry.chutes.ai
  defaultApi: https://api.chutes.ai
  supported:
    - hotkey: 5Dt7HZ7Zpw4DppPxFM7Ke3Cm7sDAWhsZXmM5ZAmE7dSVJbcQ
      registry: registry.chutes.ai
      api: https://api.chutes.ai
      socket: wss://ws.chutes.ai

# The seedless stack deliberately retains its node-local registry enforcement
# point even on mTLS-capable guests. It converts one launch-config credential
# into an exact descriptor-closed registry session and is the durable
# RegistryScopeIntent registration/revocation endpoint. Its upstream TLS
# connection uses the guest's attested mTLS certificate; removing this proxy
# would widen a workload pull to the host's registry authority.
registry:
  image: parachutes/nginx-proxy@sha256:af44ec89c18ed30caca38f08122d7cb091112cd01e3081b769e8172c86304a42
  imagePullPolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    port: 5000
    targetPort: 5000
    # Required NodePort contract: must match registry_port in Ansible and the
    # REGISTRY_PROXY_PORT consumed by miner-produced image references.
    nodePort: 30500
  nodeSelector:
    chutes/seedless-control-plane: "true"
  config:
    workerProcesses: 1
    workerConnections: 1024
    keepaliveTimeout: 65
    clientMaxBodySize: "0"
    validators:
      allowedHosts:
        - "registry.chutes.ai"
      defaultUpstream: "registry.chutes.ai"

auth:
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi
  port: 8000

registryWorkloadAuth:
  # Must name the same pre-provisioned Secret used by the chutes-miner release.
  existingSecret: registry-workload-auth

agent:
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  service:
    type: NodePort
    nodePort: 32000
    port: 8000
    targetPort: 8000
  nodeSelector:
    chutes/seedless-control-plane: "true"
  affinity: {}

failedChuteCleanup:
  image: parachutes/failed-chute-cleanup@sha256:2b90539e78e997254ee3a6f0c6d0f5e597e164503cd8a2620ce9f933b0450e28
  imagePullPolicy: Always

# Public miner owner identity, injected by Ansible during deployment.
minerCredentials:
  ownerSs58: "REPLACE_WITH_ATTESTED_OWNER_SS58"
