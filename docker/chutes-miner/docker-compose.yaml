services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chutes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chutes"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    environment:
      - POSTGRESQL=postgresql+asyncpg://user:password@postgres:5432/chutes
      - REDIS_URL=redis://redis:6379/0
      - MINER_OWNER_SS58=5E6xfU3oNU7y1a7pQwoc31fmUjwBZ2gKcNCw8EXsdtCQieUQ
      - >-
        VALIDATORS={"supported": [{"hotkey": "test_validator", "registry": "test-registry", "api": "http://test-api", "socket": "ws://test-socket"}]}
      - DEBUG=true
    ports:
      - "8080:8000"
    volumes:
      - ../api:/app/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  db-seed:
    build:
      context: ..
      dockerfile: Dockerfile
      target: sql
    environment:
      - PGPASSWORD=password
      - PGHOST=postgres
      - PGUSER=user
      - PGDATABASE=chutes
    depends_on:
      postgres:
        condition: service_healthy
      
  test:
    extends:
      file: docker-compose.base.yaml
      service: base
    entrypoint: ["/app/scripts/test.sh"]

  lint:
    extends:
      file: docker-compose.base.yaml
      service: base
    entrypoint: ["/app/scripts/lint.sh"]

volumes:
  postgres_data:
  redis_data: