---
- name: Validate pinned legacy cutover dependencies
  ansible.builtin.assert:
    that:
      - k3s_version == legacy_cutover_k3s_version
      - >-
        (lookup('ansible.builtin.file', role_path +
        '/files/k3s-killall-v1.33.1+k3s1.sh') | hash('sha256')) ==
        legacy_cutover_k3s_helper_sha256
    fail_msg: Legacy GPU cutover dependency pins do not match the reviewed closure.

- name: Install pinned host-namespace cutover tools
  ansible.builtin.apt:
    name:
      - "util-linux={{ legacy_cutover_util_linux_version }}"
      - "psmisc={{ legacy_cutover_psmisc_version }}"
    state: present
    update_cache: true

- name: Create legacy cutover helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/chutes
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create durable legacy cutover recovery directory
  ansible.builtin.file:
    path: /var/lib/chutes/legacy-gpu-cutover
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install checksum-pinned K3s shutdown helper
  ansible.builtin.copy:
    src: k3s-killall-v1.33.1+k3s1.sh
    dest: /usr/local/libexec/chutes/k3s-killall-v1.33.1+k3s1.sh
    owner: root
    group: root
    mode: "0755"

- name: Verify installed K3s shutdown helper checksum
  ansible.builtin.stat:
    path: /usr/local/libexec/chutes/k3s-killall-v1.33.1+k3s1.sh
    checksum_algorithm: sha256
  register: legacy_cutover_k3s_helper

- name: Reject a changed installed K3s shutdown helper
  ansible.builtin.assert:
    that:
      - legacy_cutover_k3s_helper.stat.checksum == legacy_cutover_k3s_helper_sha256
    fail_msg: Installed legacy GPU cutover shutdown helper failed checksum validation.

- name: Install legacy K3s admin preparation helper
  ansible.builtin.copy:
    src: prepare-legacy-kubeconfig.py
    dest: /usr/local/libexec/chutes/prepare-legacy-kubeconfig
    owner: root
    group: root
    mode: "0755"

- name: Install ephemeral legacy K3s admin preparation service
  ansible.builtin.copy:
    src: chutes-legacy-kubeconfig-prepare.service
    dest: /etc/systemd/system/chutes-legacy-kubeconfig-prepare.service
    owner: root
    group: root
    mode: "0644"

- name: Install one-use legacy GPU cutover service
  ansible.builtin.copy:
    src: chutes-legacy-gpu-cutover.service
    dest: /etc/systemd/system/chutes-legacy-gpu-cutover.service
    owner: root
    group: root
    mode: "0644"

- name: Create k3s post-start drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-post-start.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Order legacy admin preparation before normal purge
  ansible.builtin.copy:
    src: legacy-cutover-kubeconfig.conf
    dest: /etc/systemd/system/k3s-post-start.service.d/legacy-cutover-kubeconfig.conf
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd for legacy GPU cutover service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable ephemeral legacy K3s admin preparation
  ansible.builtin.systemd:
    name: chutes-legacy-kubeconfig-prepare.service
    enabled: true

- name: Setup monitoring
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/charts/deploy_monitoring.yml"
  tags: monitoring

- name: Parse and distribute credentials
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/charts/parse_credentials.yml"
  tags: miner-credentials

- name: Deploy miner charts
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/charts/deploy_miner.yml"
  tags: miner-charts
